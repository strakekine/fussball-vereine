# Holt für jeden Vereinsordner (mit verein.json) Spiele und Tabellen von der FLF und legt sie als
# <verein>/data/fussball.json ab (gelesen von <verein>/index.html), dazu je Mannschaft ein
# Kalender-Abo unter <verein>/kalender/*.ics. BGL und Nationalteam einmal für alle (gemeinsam.json).
name: Fussball-Daten

on:
  # GitHubs eigener Zeitplan ist abgeschaltet (25.10.2026, vom Nutzer: kein Verein eingetragen, die
  # Yellow Boys waren nur zum Zeigen). Wieder einschalten, sobald ein Verein dazukommt:
  # schedule:
  #   - cron: "17 6-20 * * 0,6"   # Sa/So stündlich (Reserve zum Worker)
  #   - cron: "17 19 * * 1-5"     # Mo–Fr abends
  #   - cron: "37 22 * * *"       # jeden Abend spät
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # für das Wach-halten unten

concurrency:
  group: fussball
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    # Je Verein gut eine Minute (FLF-Abfragen mit 1 s Pause).
    timeout-minutes: 45
    steps:
      # ref: main — sonst arbeitet ein Lauf, der in `concurrency` gewartet hat, mit dem Stand von seinem
      # Auslösen und kann danach nicht mehr speichern (25.10.2026: Worker-Lauf und verspätete
      # GitHub-Reserve um 17:30 fast gleichzeitig).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/fussball.mjs
      - run: node tools/fussball.mjs
      - name: Commit, falls sich etwas geändert hat
        run: |
          git add -A -- ':(glob)*/data/fussball.json' ':(glob)*/kalender/**' gemeinsam.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git config user.name "fussball-abruf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fußball: Daten aktualisiert"
          for i in 1 2 3; do
            # -X theirs: bei Konflikt gilt dieser (neuere) Abruf — die Dateien werden jedes Mal ganz neu geschrieben.
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true   # sonst scheitert der nächste Versuch an den Resten
            sleep $((i * 10))
          done
          exit 1
      # GitHub schaltet Zeitpläne nach 60 Tagen ohne Repo-Aktivität ab, und Abfragen allein
      # zählt nicht. Selbst wieder einschalten setzt die Frist zurück, ohne Leer-Commits.
      - name: Zeitplan wach halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fussball.yml/enable"
